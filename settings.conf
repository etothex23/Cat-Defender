# MEOWTRON settings. Edit with any text editor; changes apply the next time you start the game.
# You can also pick the difficulty on the title screen (it saves the choice here).
difficulty = medium        # easy | medium | hard

# ---- Rat patterns ----------------------------------------------------------------
# Each rat is handed one pattern (in order: rat 1 gets pattern1, rat 2 gets pattern2 ...
# then it wraps around) and loops it forever. A pattern can be any length.
#   R = run      J = jump (a hop that still moves forward)
#   T = turn around (instant)      H = turn to face the cat (instant)
# Every R or J lasts rat_step frames (the game runs 20 frames a second).
# Add as many patterns as you like: pattern5, pattern6 ...  (keep the numbers in a row)
pattern1 = R R R J J
pattern2 = R J J R R
pattern3 = R R T R R J J T
pattern4 = R R H J R R H J

jump_height = 14           # how high a rat jumps, in catxels

# ---- Difficulty presets -----------------------------------------------------------
# lives / spazz            starting lives and spazz-out bombs
# extra_life_every         bonus life every this many points
# mouse_every, max_mice    frames between new mice, and how many at once
# bird_every, max_birds    same for pigeons. bird_boost: every Nth frame a bird gets an
#                          extra step (smaller = faster, 0 = no boost)
# rat_every, max_rats      same for rats. rat_speed: catxels per frame. rat_step: frames per move
[easy]
lives = 5
spazz = 4
extra_life_every = 4000
mouse_every = 80
max_mice = 2
bird_every = 300
max_birds = 1
bird_boost = 0
rat_every = 240
max_rats = 1
rat_speed = 1
rat_step = 12

[medium]
lives = 3
spazz = 3
extra_life_every = 5000
mouse_every = 60
max_mice = 3
bird_every = 200
max_birds = 2
bird_boost = 3
rat_every = 160
max_rats = 2
rat_speed = 1
rat_step = 10

[hard]
lives = 2
spazz = 2
extra_life_every = 7000
mouse_every = 40
max_mice = 4
bird_every = 140
max_birds = 3
bird_boost = 2
rat_every = 100
max_rats = 3
rat_speed = 2
rat_step = 8
